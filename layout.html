<!DOCTYPE html>
<html>
<head>
  <title>Layout Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Single box with badge</h2>
  <div class="box">
    Product A
    <span class="badge">NEW</span>
  </div>

  <h2>Three boxes in a row (flex)</h2>
  <div class="row">
    <div class="box">Box 1<span class="badge">NEW</span></div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

  <h2>Six boxes in a 3-column grid</h2>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>

</body>
</html>
