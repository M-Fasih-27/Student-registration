<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration</h1>
<form action="thanks.html" method="get">
<label for="fn">Full Name:</label>
<input type="text" id="fn" name="fullname"
placeholder="Your name" required><br><br>
<label for="em">Email:</label>
<input type="email" id="em" name="email" required><br><br>
Gender:
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female<br><br>
<label for="dp">Department:</label>
<select id="dp" name="dept">
<option>AI</option>
<option>CS</option>
<option>SE</option>
</select><br><br>
Interests:
<input type="checkbox" name="interest" value="Web"> Web
<input type="checkbox" name="interest" value="AI"> AI
<input type="checkbox" name="interest" value="Games"> Games<br><br>
Message:<br>
<textarea name="msg" rows="4" cols="30"></textarea><br><br> 
<input type="submit" value="Send">
<a href="thanks.html"></a>
</form>
</body>
</html>
